services:
  runly-web:
    build: .
    image: racoondevs/runly-web:latest
    restart: unless-stopped
    ports:
      - "4321:4321"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4321/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
